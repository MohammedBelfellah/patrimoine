services:
  db:
    image: postgis/postgis:15-3.4
    container_name: patrimoine-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./mpd_complete.sql:/docker-entrypoint-initdb.d/01_mpd_complete.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: patrimoine-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file:
      - .env
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    command: ["sh", "/app/docker/web/entrypoint.sh"]

volumes:
  db_data:
